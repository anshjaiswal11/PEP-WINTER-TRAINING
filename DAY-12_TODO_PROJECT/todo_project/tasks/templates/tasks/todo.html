<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        .container {
            background: white;
            width: 400px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 12px;
            border: none;
            background: #4CAF50;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f9f9f9;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        li s {
            color: gray;
        }

        a {
            text-decoration: none;
            margin-left: 8px;
            font-size: 14px;
            color: #007BFF;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>My To-Do List</h2>

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Enter task">
            <button type="submit">Add</button>
        </form>

        <ul>
            {% for todo in todos %}
                <li>
                    {% if todo.completed %}
                        <s>{{ todo.title }}</s>
                    {% else %}
                        {{ todo.title }}
                        <span>
                            <a href="{% url 'todo-complete' todo.id %}">Done</a>
                            <a href="{% url 'todo-delete' todo.id %}">Delete</a>
                        </span>
                    {% endif %}
                </li>
            {% empty %}
                <li>No tasks yet</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
